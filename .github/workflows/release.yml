name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

# Serialisation is per job (see each job's `concurrency`), not per workflow
# run: the `publish-chrome-web-store` job waits for a human approval, and a
# workflow-level group would keep the whole run — and everything queued behind
# it — occupied for as long as that approval is pending.

env:
  REGISTRY: ghcr.io

# Every third-party action is pinned to a full commit SHA (the trailing
# comment names the release it is), and none runs in a job that can write to
# the repository or holds publishing secrets. `${{ }}` expressions never go
# into a `run:` script; they are passed through `env:` and read as "$VAR".
jobs:
  # Nothing below that tags, pushes an image or publishes an extension runs
  # until this passes. Releases run only on main: a manual run from any other
  # branch skips every job.
  ci:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Computes the release version for this run. On a push to main:
  #   - if VERSION was changed by this push (i.e. bumped by hand), that
  #     value is used as-is and tagged.
  #   - otherwise the patch component is bumped automatically, committed
  #     back to main, and tagged.
  # On pull requests, nothing is committed/tagged — VERSION is only read,
  # for build-only validation. On pushes this runs after `ci`, so a tag and
  # a bump commit only ever follow a green build.
  version:
    needs: ci
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.ci.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-version
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version: ${{ steps.final.outputs.version }}
      owner: ${{ steps.owner.outputs.lc }}
      extension_changed: ${{ steps.changes.outputs.extension }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lc=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Plain git instead of a path-filter action: this job can write to the
      # repository, so it runs no third-party code.
      - name: Detect extension changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          extension_changed() {
            git diff --name-only "$1" HEAD | grep -q '^extension/'
          }
          case "$EVENT_NAME" in
            push)
              # A new branch or a force push leaves no usable "before"; build.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                changed=true
              elif extension_changed "$BEFORE"; then
                changed=true
              else
                changed=false
              fi
              ;;
            pull_request)
              if extension_changed "$BASE_SHA"; then changed=true; else changed=false; fi
              ;;
            *)
              # A manual run is a deliberate request to build everything.
              changed=true
              ;;
          esac
          echo "extension=$changed" >> "$GITHUB_OUTPUT"

      - name: Check whether VERSION was manually bumped in this push
        id: diff
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch or a force push leaves no usable "before"; keep VERSION.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'VERSION'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-bump patch version
        if: github.event_name == 'push' && steps.diff.outputs.changed == 'false'
        run: |
          current=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r major minor patch <<< "$current"
          new_version="$major.$minor.$((patch + 1))"
          echo "$new_version" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $new_version"
          git push origin HEAD:main

      - name: Sync manifest versions with VERSION
        if: github.event_name == 'push'
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          changed=false
          for manifest in extension/chrome/manifest.json extension/firefox/manifest.json; do
            current=$(jq -r '.version' "$manifest")
            if [ "$current" != "$version" ]; then
              jq --arg v "$version" '.version = $v' "$manifest" > "$manifest.tmp"
              mv "$manifest.tmp" "$manifest"
              git add "$manifest"
              changed=true
            fi
          done
          if [ "$changed" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: sync manifest version to $version"
            git push origin HEAD:main
          fi

      - name: Tag release
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version=$(tr -d '[:space:]' < VERSION)
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Set output version
        id: final
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

  server:
    needs: [ci, version]
    # Pushed images require a green `ci`; a PR build pushes nothing.
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-server
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./server
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/helixsync-server:latest
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/helixsync-server:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  web:
    needs: [ci, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-web
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./web
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/helixsync-web:latest
            ${{ env.REGISTRY }}/${{ needs.version.outputs.owner }}/helixsync-web:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Builds the extension zip. Read-only and holds no secrets: it runs
  # `npm ci` (and so install scripts), which is why releasing and publishing
  # are separate jobs that never install or build anything.
  extension:
    needs: [ci, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.ci.result == 'success' || github.event_name == 'pull_request') && needs.version.outputs.extension_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Stamp manifest versions
        run: |
          for manifest in chrome/manifest.json firefox/manifest.json; do
            jq --arg v "$VERSION" '.version = $v' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          done

      - run: npm ci
      - run: npm run build
      - run: npm run build:firefox
      - run: npm test

      - name: Package extension
        run: |
          (cd dist && zip -r "../helixsync-extension-${VERSION}.zip" .)
          (cd dist-firefox && zip -r "../helixsync-extension-firefox-${VERSION}.zip" .)
          # Source for AMO's reviewers: the commit plus the stamped manifest
          # versions, so their build matches the package exactly.
          ref=$(git -c user.name=ci -c user.email=ci@localhost stash create)
          git -C .. archive --format=zip -o "extension/helixsync-extension-firefox-source-${VERSION}.zip" "${ref:-HEAD}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helixsync-extension
          path: extension/helixsync-extension-${{ needs.version.outputs.version }}.zip
          retention-days: 30

      # Unsigned: Firefox installs it only once AMO has signed it.
      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helixsync-extension-firefox
          path: extension/helixsync-extension-firefox-${{ needs.version.outputs.version }}.zip
          retention-days: 30

      - name: Upload Firefox source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helixsync-extension-firefox-source
          path: extension/helixsync-extension-firefox-source-${{ needs.version.outputs.version }}.zip
          retention-days: 30

  # Decides which browsers this run releases: a package is released only when
  # it differs from the one in the last GitHub release that shipped it. Most
  # changes are to shared code (extension/src/), so the paths a push touched
  # can't tell which package changed; the built files can. Chrome and Firefox
  # code is kept apart (extension/chrome/, extension/firefox/, `@platform`),
  # so a Firefox-only change leaves the Chrome package byte-identical and
  # nothing is published to the Chrome Web Store. The manifest's version is
  # ignored, since every run stamps a new one. No install step, no
  # third-party action: it only downloads zips and compares them.
  extension-changes:
    needs: [ci, version, extension]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.extension.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      chrome: ${{ steps.compare.outputs.chrome }}
      firefox: ${{ steps.compare.outputs.firefox }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension-firefox

      - name: Compare with the last released packages
        id: compare
        run: |
          # A failure inside $(changed ...) fails the step rather than being
          # read as an answer.
          shopt -s inherit_errexit
          # Prints "true" unless <zip> has the same files as the newest
          # earlier release asset matching <pattern>.
          changed() {
            local zip="$1" pattern="$2" label="$3" tag asset=""
            for tag in $(gh release list --limit 100 --json tagName,isDraft \
              | jq -r '.[] | select(.isDraft | not) | .tagName'); do
              [ "$tag" = "v$VERSION" ] && continue
              asset=$(gh release view "$tag" --json assets \
                | jq -r --arg p "$pattern" '[.assets[].name | select(test($p))][0] // empty')
              [ -n "$asset" ] && break
            done
            if [ -z "$asset" ]; then
              echo "$label: no earlier release has this package" >&2
              echo true
              return
            fi
            rm -rf "cmp-$label" && mkdir -p "cmp-$label/old" "cmp-$label/new"
            gh release download "$tag" --pattern "$asset" --dir "cmp-$label"
            unzip -q "cmp-$label/$asset" -d "cmp-$label/old"
            unzip -q "$zip" -d "cmp-$label/new"
            for side in old new; do
              jq -S 'del(.version)' "cmp-$label/$side/manifest.json" > "cmp-$label/$side/manifest.norm"
              rm "cmp-$label/$side/manifest.json"
            done
            if diff -r "cmp-$label/old" "cmp-$label/new" >&2; then
              echo "$label: same as $asset ($tag), not releasing" >&2
              echo false
            else
              echo "$label: differs from $asset ($tag)" >&2
              echo true
            fi
          }
          chrome=$(changed "helixsync-extension-${VERSION}.zip" '^helixsync-extension-[0-9]+\.[0-9]+\.[0-9]+\.zip$' chrome)
          firefox=$(changed "helixsync-extension-firefox-${VERSION}.zip" '^helixsync-extension-firefox-[0-9]+\.[0-9]+\.[0-9]+\.zip$' firefox)
          echo "chrome=$chrome" >> "$GITHUB_OUTPUT"
          echo "firefox=$firefox" >> "$GITHUB_OUTPUT"

  # Attaches the changed zips to the GitHub release. Can write to the
  # repository, so it only downloads the artifacts and calls the preinstalled
  # `gh`: no install step, no third-party action.
  #
  # Runs after the publish jobs, because `extension-changes` compares with the
  # zips attached to the last release: a zip attached although its publish
  # failed or was rejected would make the next run see "unchanged" and never
  # retry it. A browser's zip is therefore attached only when its publish job
  # succeeded or did not run (nothing changed, or its secret is unset, which
  # the job reports as a success). `!cancelled()` lets this job run when a
  # publish job was skipped; a failed or cancelled one just leaves its zip off.
  # The cost: the release appears only once any pending publish approval is
  # given.
  release-extension:
    needs: [ci, version, extension, extension-changes, publish-chrome-web-store, publish-firefox-amo]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.extension.result == 'success' && needs.extension-changes.result == 'success' && (needs.extension-changes.outputs.chrome == 'true' || needs.extension-changes.outputs.firefox == 'true') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-extension
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TARGET_SHA: ${{ github.sha }}
      CHROME_CHANGED: ${{ needs.extension-changes.outputs.chrome }}
      FIREFOX_CHANGED: ${{ needs.extension-changes.outputs.firefox }}
      CHROME_PUBLISH: ${{ needs.publish-chrome-web-store.result }}
      FIREFOX_PUBLISH: ${{ needs.publish-firefox-amo.result }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension-firefox

      - name: Attach to GitHub Release
        run: |
          tag="v${VERSION}"
          zips=()
          # Not a failed or cancelled publish: see the job comment.
          published() { [ "$1" = success ] || [ "$1" = skipped ]; }
          if [ "$CHROME_CHANGED" = true ] && published "$CHROME_PUBLISH"; then
            zips+=("helixsync-extension-${VERSION}.zip")
          fi
          if [ "$FIREFOX_CHANGED" = true ] && published "$FIREFOX_PUBLISH"; then
            zips+=("helixsync-extension-firefox-${VERSION}.zip")
          fi
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No package to attach: every changed package failed to publish"
            exit 0
          fi
          # The release normally exists already (the version job pushed the
          # tag); create it if not, and replace the assets on a re-run.
          gh release create "$tag" "${zips[@]}" --target "$TARGET_SHA" --title "$tag" --generate-notes \
            || gh release upload "$tag" "${zips[@]}" --clobber

  # Pushes this version to the Chrome Web Store. Holds the CHROME_* secrets, so
  # it is deliberately tiny: read-only token, a protected `chrome-web-store`
  # environment (put the secrets there and require a reviewer, see
  # docs/releasing.md), and it only downloads the already-built zip. It
  # installs and builds nothing, so no package install script ever runs next
  # to these secrets.
  #
  # The environment should also restrict deployment branches to `main`
  # (repo Settings -> Environments). Repo-level secrets of the same names are
  # still readable from here, so the job works before that is set up.
  #
  # Skips itself while CHROME_EXTENSION_ID is unset, so this is safe to ship
  # before the one-time OAuth setup. The item must already exist in the Web
  # Store dashboard from a prior manual submission; this API can only publish
  # updates to it, not create it the first time.
  #
  # Runs only when the Chrome package changed (`extension-changes`), so a
  # Firefox-only change never reaches the Web Store.
  publish-chrome-web-store:
    needs: [ci, version, extension, extension-changes]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.extension.result == 'success' && needs.extension-changes.outputs.chrome == 'true' }}
    runs-on: ubuntu-latest
    environment: chrome-web-store
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension

      - name: Publish to Chrome Web Store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: |
          if [ -z "$CHROME_EXTENSION_ID" ]; then
            echo "CHROME_EXTENSION_ID not set, skipping Web Store publish"
            exit 0
          fi

          # Prints the response body on failure (still fails the step via
          # `exit 1`, since -f alone would swallow it silently) so a
          # rejected upload/publish is diagnosable from the CI log.
          call() {
            local method="$1" url="$2"
            shift 2
            local status
            status=$(curl -s -o /tmp/cws_response.json -w '%{http_code}' -X "$method" "$@" "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              # Diagnostics go to stderr: callers either capture this
              # function's stdout into a variable or redirect it to
              # /dev/null, either of which would otherwise swallow the
              # error silently.
              echo "Chrome Web Store API call failed: $method $url (HTTP $status)" >&2
              cat /tmp/cws_response.json >&2
              exit 1
            fi
            cat /tmp/cws_response.json
          }

          token_response=$(call POST "https://oauth2.googleapis.com/token" \
            -d "client_id=$CHROME_CLIENT_ID" \
            -d "client_secret=$CHROME_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          access_token=$(echo "$token_response" | jq -r '.access_token')
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "Failed to obtain an access token"
            exit 1
          fi

          call POST "https://chromewebstore.googleapis.com/upload/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:upload" \
            -H "Authorization: Bearer $access_token" \
            -T "helixsync-extension-${VERSION}.zip" > /dev/null

          # STAGED_PUBLISH: once the store approves the upload it is staged,
          # not released. Publishing it is a manual click in the Web Store
          # dashboard, so a pipeline compromise cannot ship to users alone.
          call POST "https://chromewebstore.googleapis.com/v2/publishers/$CHROME_PUBLISHER_ID/items/$CHROME_EXTENSION_ID:publish" \
            -H "Authorization: Bearer $access_token" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"STAGED_PUBLISH"}' > /dev/null

  # Submits this version to addons.mozilla.org, which reviews, signs and
  # publishes it. Built like publish-chrome-web-store: the AMO_* secrets live
  # in a protected `firefox-amo` environment, and the job only downloads the
  # already-built zips and calls AMO's API with curl and openssl, so no
  # package install script ever runs next to them. The add-on must already
  # exist on AMO (first version uploaded by hand) under the manifest's
  # gecko.id. Skips itself while AMO_JWT_ISSUER is unset.
  #
  # Runs only when the Firefox package changed (`extension-changes`).
  publish-firefox-amo:
    needs: [ci, version, extension, extension-changes]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.ci.result == 'success' && needs.extension.result == 'success' && needs.extension-changes.outputs.firefox == 'true' }}
    runs-on: ubuntu-latest
    environment: firefox-amo
    concurrency:
      group: release-publish-firefox
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension-firefox

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: helixsync-extension-firefox-source

      - name: Submit to addons.mozilla.org
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ]; then
            echo "AMO_JWT_ISSUER not set, skipping AMO submission"
            exit 0
          fi
          api=https://addons.mozilla.org/api/v5/addons
          zip="helixsync-extension-firefox-${VERSION}.zip"
          source="helixsync-extension-firefox-source-${VERSION}.zip"
          guid=$(unzip -p "$zip" manifest.json | jq -er '.browser_specific_settings.gecko.id')

          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          # A fresh token per call: AMO wants a unique jti and exp <= iat + 5 min.
          token() {
            local now header payload sig
            now=$(date +%s)
            header=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
            payload=$(jq -nc --arg iss "$AMO_JWT_ISSUER" --arg jti "$(openssl rand -hex 16)" \
              --argjson iat "$now" --argjson exp "$((now + 240))" \
              '{iss: $iss, jti: $jti, iat: $iat, exp: $exp}' | b64url)
            sig=$(printf '%s' "$header.$payload" | openssl dgst -sha256 -hmac "$AMO_JWT_SECRET" -binary | b64url)
            printf '%s' "$header.$payload.$sig"
          }
          # Prints the body; on a non-2xx status prints it to stderr and fails.
          call() {
            local method="$1" url="$2" status
            shift 2
            status=$(curl -s -o /tmp/amo_response.json -w '%{http_code}' -X "$method" \
              -H "Authorization: JWT $(token)" "$@" "$url")
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "AMO API call failed: $method $url (HTTP $status)" >&2
              cat /tmp/amo_response.json >&2
              exit 1
            fi
            cat /tmp/amo_response.json
          }

          uuid=$(call POST "$api/upload/" -F "upload=@$zip" -F channel=listed | jq -er '.uuid')

          # Wait for AMO's validator (usually under a minute).
          for _ in $(seq 60); do
            upload=$(call GET "$api/upload/$uuid/")
            [ "$(echo "$upload" | jq -r '.processed')" = true ] && break
            sleep 10
          done
          if [ "$(echo "$upload" | jq -r '.processed')" != true ]; then
            echo "AMO did not finish validating upload $uuid in time" >&2
            exit 1
          fi
          if [ "$(echo "$upload" | jq -r '.valid')" != true ]; then
            echo "AMO rejected the package:" >&2
            echo "$upload" | jq '.validation' >&2
            exit 1
          fi

          # The license is inherited from the previous version.
          version_id=$(call POST "$api/addon/$guid/versions/" \
            -F "upload=$uuid" -F "source=@$source" | jq -er '.id')

          notes='Build: Node.js 22, npm 10. From the source root: cd extension && npm ci && npm run build:firefox. Output: extension/dist-firefox/, identical to the package. Testing needs a HelixSync server: docker compose up (see README.md). innerHTML values in the popup are escaped (src/popup/main.ts, th/esc helpers).'
          call PATCH "$api/addon/$guid/versions/$version_id/" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg n "$notes" '{approval_notes: $n}')" > /dev/null

          echo "Submitted $VERSION to AMO for review (version $version_id)"
