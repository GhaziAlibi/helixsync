# Production/Portainer deploy: pulls the prebuilt images published by
# .github/workflows/release.yml instead of building server/ and web/ from
# source. Paste this directly into Portainer's Stacks UI (or `docker
# compose -f docker-compose.prod.yml up -d`) — no repo checkout or Docker
# build step needed on the host.
#
# Pin HELIXSYNC_VERSION to a released version (e.g. 0.1.2) instead of
# "latest" for reproducible deploys — see the tags at
# https://github.com/GhaziAlibi/helixsync/pkgs/container/helixsync-server
# and https://github.com/GhaziAlibi/helixsync/pkgs/container/helixsync-web
#
# Note: the web image's API base URL is compiled in at build time, not
# read at container startup, so this compose file cannot override it —
# the published image already defaults to same-origin relative paths
# (nginx proxies /api/* to server), which is the intended setup for the
# vast majority of deployments. If you genuinely need a different API
# origin, you must build your own web image with that Vite build arg set
# (see web/Dockerfile) instead of using the published one.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helixsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-helixsync}
    volumes:
      - helixsync_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helixsync} -d ${POSTGRES_DB:-helixsync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - helixsync

  server:
    image: ghcr.io/ghazialibi/helixsync-server:${HELIXSYNC_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-helixsync}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-helixsync}
      BIND_ADDR: 0.0.0.0:8080
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      REQUIRE_ENCRYPTION: ${REQUIRE_ENCRYPTION:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS:-900}
      REFRESH_TOKEN_TTL_SECS: ${REFRESH_TOKEN_TTL_SECS:-2592000}
      WEB_SESSION_TTL_SECS: ${WEB_SESSION_TTL_SECS:-1209600}
      COMPACTION_INTERVAL_SECS: ${COMPACTION_INTERVAL_SECS:-3600}
      TOMBSTONE_RETENTION_SECS: ${TOMBSTONE_RETENTION_SECS:-2592000}
      RUST_LOG: ${RUST_LOG:-info}
    # No `ports:` mapping — the backend is never reachable from outside the
    # docker network. `web`'s nginx (web/nginx.conf) proxies /api/* to it
    # over the internal `helixsync` network instead.
    networks:
      - helixsync

  web:
    image: ghcr.io/ghazialibi/helixsync-web:${HELIXSYNC_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - helixsync

volumes:
  helixsync_postgres_data:

networks:
  helixsync:
