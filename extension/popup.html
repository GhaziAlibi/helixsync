<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HelixSync</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1a1f26;
        --muted: #667085;
        --border: #e4e7ec;
        --surface: #ffffff;
        --surface-subtle: #f8f9fb;
        --accent: #2f5eff;
        --accent-ink: #ffffff;
        --danger: #d93025;
        --success: #1e8e3e;
        --warning: #b5860a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 340px;
        margin: 0;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        background: var(--surface);
        font-size: 13px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }

      .logo {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: linear-gradient(135deg, #2f5eff, #6a8bff);
        flex-shrink: 0;
      }

      header h1 {
        font-size: 14px;
        font-weight: 600;
        margin: 0;
        flex: 1;
      }

      .icon-button {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: none;
        background: transparent;
        border-radius: 6px;
        cursor: pointer;
        color: var(--muted);
        padding: 0;
      }

      .icon-button:hover {
        background: var(--surface-subtle);
        color: var(--ink);
      }

      main {
        padding: 16px 14px 14px;
        max-height: 520px;
        overflow-y: auto;
      }

      h2.view-title {
        font-size: 13px;
        font-weight: 600;
        margin: 0 0 2px;
      }

      p.view-subtitle {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 14px;
        line-height: 1.5;
      }

      fieldset {
        border: none;
        padding: 0;
        margin: 0 0 18px;
      }

      fieldset legend {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        padding: 0 0 8px;
      }

      label.field {
        display: block;
        font-size: 12px;
        font-weight: 500;
        color: var(--ink);
        margin-bottom: 10px;
      }

      label.field span {
        display: block;
        margin-bottom: 4px;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      select {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        font-size: 13px;
        font-family: inherit;
        color: var(--ink);
        background: var(--surface);
      }

      input:focus,
      select:focus {
        outline: 2px solid #c4d1ff;
        outline-offset: 0;
        border-color: var(--accent);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 7px 0;
        border-bottom: 1px solid var(--surface-subtle);
      }

      .row:last-child {
        border-bottom: none;
      }

      .row .row-label {
        font-size: 13px;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 20px;
        flex-shrink: 0;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .switch .track {
        position: absolute;
        inset: 0;
        background: #d0d5dd;
        border-radius: 20px;
        transition: background 0.15s ease;
        cursor: pointer;
      }

      .switch .track::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 2px;
        top: 2px;
        background: white;
        border-radius: 50%;
        transition: transform 0.15s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      }

      .switch input:checked + .track {
        background: var(--accent);
      }

      .switch input:checked + .track::before {
        transform: translateX(14px);
      }

      button {
        width: 100%;
        padding: 9px;
        margin-top: 4px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        font-family: inherit;
      }

      button:hover {
        background: var(--surface-subtle);
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      button.primary:hover {
        background: #2650db;
      }

      button.danger {
        color: var(--danger);
        border-color: #f3d4d1;
      }

      button.danger:hover {
        background: #fdf1f0;
      }

      button.ghost {
        border-color: transparent;
        background: transparent;
      }

      button.ghost:hover {
        background: var(--surface-subtle);
      }

      .status-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface-subtle);
        margin-bottom: 12px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #9aa0a6;
        flex-shrink: 0;
      }

      .dot.synced {
        background: var(--success);
      }

      .dot.syncing {
        background: var(--warning);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .dot.error {
        background: var(--danger);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }

      .status-text strong {
        display: block;
        font-size: 13px;
      }

      .status-text span {
        font-size: 12px;
        color: var(--muted);
      }

      .meta {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .section-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 16px 0 6px;
      }

      .item-list {
        list-style: none;
        margin: 0 0 4px;
        padding: 0;
        max-height: 140px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .item {
        padding: 7px 9px;
        border-top: 1px solid var(--border);
      }

      .item:first-child {
        border-top: none;
      }

      .item-title {
        font-size: 12.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .item-meta {
        font-size: 11px;
        color: var(--muted);
        margin-top: 1px;
      }

      .restore-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .restore-item .item-title {
        flex: 1;
      }

      .restore-button {
        width: auto;
        margin-top: 0;
        padding: 4px 10px;
        font-size: 11.5px;
        flex-shrink: 0;
      }

      .status-message {
        font-size: 12px;
        margin-top: 10px;
        min-height: 14px;
      }

      .status-message.error {
        color: var(--danger);
      }

      .account-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }

      .account-row .email {
        font-size: 13px;
        font-weight: 500;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 18, 24, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 100;
      }

      .modal-card {
        width: 100%;
        background: var(--surface);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(15, 18, 24, 0.25);
      }

      .modal-card p {
        font-size: 12.5px;
        line-height: 1.5;
        margin: 0 0 14px;
        color: var(--ink);
      }

      .modal-actions {
        display: flex;
        gap: 8px;
      }

      .modal-actions button {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"></div>
      <h1>HelixSync</h1>
      <span id="header-actions"></span>
    </header>
    <main id="app">Loading…</main>
    <script type="module" src="/src/popup/main.ts"></script>
  </body>
</html>
