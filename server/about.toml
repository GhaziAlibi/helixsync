# cargo-about configuration: builds THIRD_PARTY_LICENSES.txt for the server
# image (server/Dockerfile). Generation fails if any compiled crate is under
# a license not listed here, so a new dependency can't quietly bring in terms
# that conflict with HelixSync's MIT license.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Only what is compiled into the Linux binary: no dev-dependencies, no
# Windows/macOS-only crates.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
# Leaves out helixsync-server itself (`publish = false`).
private = { ignore = true }
