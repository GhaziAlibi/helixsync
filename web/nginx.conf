map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Sync snapshots can be 20-60MB of JSON; compress responses so they aren't
# shipped over the wire raw.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css text/html;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Match the backend's own sync upload limit (server/src/sync/routes.rs,
    # MAX_UPLOAD_BODY_BYTES ~126MiB) so nginx isn't a tighter bottleneck.
    client_max_body_size 150m;

    # Proxies to the `server` container over the internal docker network —
    # the backend is never published to the host, so this is the only path
    # to it (browsers, the extension, and direct API callers alike).
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/v1/ws is a websocket upgrade (server/src/websocket.rs).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
