# Security headers for every response nginx generates itself.
#
# nginx does NOT inherit add_header from an outer block into a block that
# declares its own add_header, so this file is included in the server block
# and again in every location that sets headers of its own (/assets/,
# = /index.html). A new location that calls add_header must include it too,
# or its responses silently lose all of these.
#
# The content-security-policy is as strict as the dashboard allows, and was
# checked against the built output: index.html has no inline script or style
# (Vite emits one external module script and one external stylesheet), the
# bundle uses no eval/new Function, the CSS has no url()/data: references, and
# the one `style={{ width }}` in the UI is set through the CSSOM, which
# style-src does not restrict (only inline style *attributes in markup* and
# <style> elements are blocked). Everything the page loads or calls is
# same-origin: /api is proxied by this nginx. If you build the web image with
# VITE_API_BASE_URL pointing at a different origin, connect-src below must
# list that origin too, or the dashboard can't reach its API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()" always;
# $hsts_header (default.conf) is empty unless the request arrived through a
# TLS-terminating proxy; nginx omits a header whose value is empty.
add_header Strict-Transport-Security $hsts_header always;
